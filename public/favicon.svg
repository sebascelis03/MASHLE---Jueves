<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#grad)" />
  
  <!-- Calendar Base -->
  <g filter="url(#shadow)" transform="translate(64, 74)">
    <rect x="0" y="50" width="384" height="310" rx="36" fill="#ffffff" />
    <path d="M 0 50 Q 0 16 36 16 L 348 16 Q 384 16 384 50 L 384 100 L 0 100 Z" fill="#1e293b" />
    
    <!-- Calendar Rings -->
    <rect x="70" y="0" width="24" height="40" rx="12" fill="#94a3b8" />
    <rect x="290" y="0" width="24" height="40" rx="12" fill="#94a3b8" />
    
    <!-- Grid Dots / Checkmark -->
    <circle cx="82" cy="150" r="14" fill="#3b82f6" />
    <circle cx="156" cy="150" r="14" fill="#94a3b8" />
    <circle cx="230" cy="150" r="14" fill="#94a3b8" />
    <circle cx="304" cy="150" r="14" fill="#10b981" />
    
    <circle cx="82" cy="214" r="14" fill="#94a3b8" />
    <circle cx="156" cy="214" r="14" fill="#f59e0b" />
    <circle cx="230" cy="214" r="14" fill="#94a3b8" />
    <circle cx="304" cy="214" r="14" fill="#3b82f6" />
    
    <!-- Access Checkmark Star Badge -->
    <path d="M 82 285 L 180 285" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
    <path d="M 230 270 L 255 295 L 310 240" stroke="#10b981" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>